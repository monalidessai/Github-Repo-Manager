version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pt_repo_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: repo_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repo_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: pt_repo_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/repo_manager
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_ORG: ${GITHUB_ORG}
      SESSION_SECRET: ${SESSION_SECRET}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      WARNING_DAYS: ${WARNING_DAYS:-7}
      DEFAULT_EXPIRY_ACTION: ${DEFAULT_EXPIRY_ACTION:-delete}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: pt_repo_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
